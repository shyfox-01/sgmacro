[project]
name = "sgmacro"
version = "2.1.0"
description = "Agent-assisted workflow for Singapore residential price and rent predictor data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "Jinja2>=3.1",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# The Claude API's SDK is optional: OpenAI-compatible services and Ollama are
# reached with requests, and the committed response cache reproduces every LLM
# step with no model at all. 1.11 is the first version tested with the beta
# parameters the backend sends.
anthropic = ["anthropic>=1.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sgmacro = "sgmacro.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgmacro = ["templates/*.j2"]
